#
# Resources live in their own root subtree, not below a site - the same shape
# Sitegeist.Taxonomy uses for vocabularies. That keeps centrally managed content
# out of the site's content tree and out of site exports.
#
'Sitegeist.ResourceReferenceEditor:Root':
  label: 'Resources'
  # Root aggregates must be of type root - the content repository rejects anything
  # else (ConstraintChecks::requireNodeTypeToBeOfTypeRoot).
  superTypes:
    'Neos.ContentRepository:Root': true
  ui:
    label: 'Resources'
    icon: 'box-archive'
  constraints:
    nodeTypes:
      '*': false
      'Sitegeist.ResourceReferenceEditor:Collection': true

'Sitegeist.ResourceReferenceEditor:Collection':
  superTypes:
    'Neos.Neos:Node': true
  ui:
    label: 'Resource collection'
    icon: 'folder'
  properties:
    title:
      type: string
      ui:
        label: 'Title'
        inspector:
          group: 'document'
  # Only resources may live in a collection. A content element cannot be put here,
  # and a resource cannot be put on a page - the two are different kinds of node.
  constraints:
    nodeTypes:
      '*': false
      'Sitegeist.ResourceReferenceEditor:Resource': true

#
# The Resource node type itself is declared in PHP (Classes/NodeTypes/Resource.php),
# because that is what lets an OPGM node type inherit from it. What cannot be
# expressed there is this: Neos registers the creation dialog machinery on
# 'Neos.Neos:Document' and 'Neos.Neos:Content' only, so a node type that is neither -
# which a resource deliberately is not - has to ask for it.
#
# Without the postprocessor, `showInCreationDialog` on a property produces no
# creation dialog element; without the creation handler, the values sent when a
# resource is created are dropped on the way in.
#
'Sitegeist.ResourceReferenceEditor:Resource':
  postprocessors:
    'CreationDialogPostprocessor':
      position: 'after NodeTypePresetPostprocessor'
      postprocessor: 'Neos\Neos\Ui\Infrastructure\ContentRepository\CreationDialog\CreationDialogNodeTypePostprocessor'
  options:
    nodeCreationHandlers:
      promotedElements:
        factoryClassName: 'Neos\Neos\Ui\Infrastructure\ContentRepository\CreationDialog\PromotedElementsCreationHandlerFactory'

  #
  # A resource holds nothing unless its own node type says so, and what it says has
  # to be a resource as well - with OPGM that is a child relation whose item type
  # implements the Resource interface. Without this, a node type that declares no
  # children at all would accept every content element in the installation.
  #
  constraints:
    nodeTypes:
      '*': false
